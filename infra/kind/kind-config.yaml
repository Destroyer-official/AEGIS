kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 9000
        hostPort: 9000
        protocol: TCP
      - containerPort: 9001
        hostPort: 9001
        protocol: TCP
      - containerPort: 8081
        hostPort: 8081
        protocol: TCP
      - containerPort: 8080
        hostPort: 8080
        protocol: TCP
      - containerPort: 30092
        hostPort: 9092
        protocol: TCP
      - containerPort: 8181
        hostPort: 8181
        protocol: TCP
      - containerPort: 19120
        hostPort: 19120
        protocol: TCP
