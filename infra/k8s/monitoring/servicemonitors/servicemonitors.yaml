apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: aegis-kafka
  namespace: monitoring
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app: aegis-kafka
  endpoints:
    - port: jmx
      path: /metrics
      interval: 15s
  namespaceSelector:
    matchNames:
      - default
---
