apiVersion: v1
kind: Namespace
metadata:
  name: litmus
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: litmus-admin
  namespace: litmus
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: litmus-admin
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
  - nonResourceURLs: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: litmus-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: litmus-admin
subjects:
  - kind: ServiceAccount
    name: litmus-admin
    namespace: litmus
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litmus-operator
  namespace: litmus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: litmus-operator
  template:
    metadata:
      labels:
        app: litmus-operator
    spec:
      serviceAccountName: litmus-admin
      containers:
        - name: litmus-operator
          image: litmuschaos/litmus-operator:2.13.0
          ports:
            - containerPort: 8080
          env:
            - name: WATCH_NAMESPACE
              value: ""
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OPERATOR_NAME
              value: "litmus-operator"
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: litmus-operator
  namespace: litmus
spec:
  selector:
    app: litmus-operator
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP