apiVersion: litmuschaos.io/v1alpha1
kind: ChaosExperiment
metadata:
  name: pod-delete
  namespace: litmus
spec:
  definition:
    scope: Namespaced
    permissions:
      - apiGroups: [""]
        resources: ["pods"]
        verbs: ["get", "list", "delete"]
      - apiGroups: ["apps"]
        resources: ["deployments", "statefulsets"]
        verbs: ["get", "list", "patch"]
    experiment:
      name: pod-delete
      spec:
        engine: litmus
        components:
          runner:
            image: litmuschaos/go-runner:latest
            imagePullPolicy: Always
          chaoslib:
            image: litmuschaos/litmus-lib:latest
            imagePullPolicy: Always
        definition:
          scope: Namespaced
          permissions:
            - apiGroups: [""]
              resources: ["pods"]
              verbs: ["get", "list", "delete"]
            - apiGroups: ["apps"]
              resources: ["deployments", "statefulsets"]
              verbs: ["get", "list", "patch"]
          experiment:
            name: pod-delete
            spec:
              engine: litmus
              steps:
                - name: chaos
                  image: litmuschaos/litmus-lib:latest
                  env:
                    - name: TOTAL_CHAOS_DURATION
                      value: "60"
                    - name: CHAOS_INTERVAL
                      value: "10"
                    - name: FORCE
                      value: "false"
                    - name: PODS_AFFECTED_PERC
                      value: "50"
                    - name: TARGET_PODS
                      value: ""
                    - name: TARGET_CONTAINER
                      value: ""
                    - name: RAMP_TIME
                      value: ""
                    - name: SEQUENCE
                      value: "parallel"
                    - name: LIB
                      value: "litmus"
                    - name: LIB_IMAGE
                      value: "litmuschaos/litmus-lib:latest"
                    - name: LIB_PULL_POLICY
                      value: "Always"
                    - name: NAMESPACE
                      value: "default"
                    - name: APP_LABEL
                      value: ""
                    - name: APP_NS
                      value: "default"