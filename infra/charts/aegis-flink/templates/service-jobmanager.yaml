apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-jobmanager
  labels:
    app: {{ .Release.Name }}
    component: jobmanager
spec:
  type: ClusterIP
  ports:
    - port: 6123
      targetPort: 6123
      name: rpc
    - port: 8081
      targetPort: 8081
      name: http
  selector:
    app: {{ .Release.Name }}
    component: jobmanager