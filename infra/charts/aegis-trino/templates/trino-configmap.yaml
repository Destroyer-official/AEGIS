apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-catalog
  labels:
    app: {{ .Release.Name }}
data:
  aegis.properties: |
    connector.name=iceberg
    iceberg.catalog.type=nessie
    iceberg.nessie-catalog.uri=http://aegis-polaris:19120/api/v1
    iceberg.nessie-catalog.ref=main
    iceberg.nessie-catalog.default-warehouse-dir=s3://aegis-warehouse/
    fs.native-s3.enabled=true
    s3.endpoint=http://aegis-minio:9000
    s3.path-style-access=true
    s3.region=us-east-1
    s3.aws-access-key=minioadmin
    s3.aws-secret-key=minioadmin
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  labels:
    app: {{ .Release.Name }}
data:
  config.properties: |
    coordinator=true
    node-scheduler.include-coordinator=true
    http-server.http.port=8080
    discovery.uri=http://{{ .Release.Name }}-coordinator:8080
  config-worker.properties: |
    coordinator=false
    http-server.http.port=8080
    discovery.uri=http://{{ .Release.Name }}-coordinator:8080
  log.properties: |
    io.trino=INFO
