apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-worker
  labels:
    app: {{ .Release.Name }}
    component: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
      component: worker
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
        component: worker
    spec:
      containers:
        - name: trino
          image: "{{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag }}"
          imagePullPolicy: {{ .Values.worker.image.pullPolicy }}
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-Xmx512m"
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          volumeMounts:
            - name: catalog
              mountPath: /etc/trino/catalog
            - name: config
              mountPath: /etc/trino/config.properties
              subPath: config-worker.properties
            - name: config
              mountPath: /etc/trino/log.properties
              subPath: log.properties
      volumes:
        - name: catalog
          configMap:
            name: {{ .Release.Name }}-catalog
        - name: config
          configMap:
            name: {{ .Release.Name }}-config
