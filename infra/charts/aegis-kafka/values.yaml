replicaCount: 1

image:
  repository: apache/kafka
  tag: "3.7.0"
  pullPolicy: IfNotPresent

service:
  type: NodePort
  port: 9092
  nodePort: 9092

resources:
  requests:
    memory: "384Mi"
    cpu: "200m"
  limits:
    memory: "768Mi"
    cpu: "400m"

persistence:
  enabled: true
  size: 5Gi

topics:
  - name: raw-l4-scans
    partitions: 3
    replicationFactor: 1
  - name: tls-fingerprints
    partitions: 3
    replicationFactor: 1
  - name: l7-banners
    partitions: 3
    replicationFactor: 1
  - name: scan-commands
    partitions: 3
    replicationFactor: 1
  - name: enrichment-events
    partitions: 3
    replicationFactor: 1
