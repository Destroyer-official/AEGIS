image:
  repository: python
  tag: "3.12-slim"
  pullPolicy: IfNotPresent

resources:
  requests:
    memory: "128Mi"
    cpu: "50m"
  limits:
    memory: "256Mi"
    cpu: "100m"

nessie:
  endpoint: http://aegis-polaris:19120
  catalog: aegis
  defaultBranch: main

minio:
  endpoint: http://aegis-minio:9000
  accessKey: minioadmin
  secretKey: minioadmin
  bucket: aegis-warehouse

namespace: aegis

# Job runs once at cluster startup to create Iceberg tables
# Minimal resources since it only creates table metadata