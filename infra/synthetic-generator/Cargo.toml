[package]
name = "aegis-synthetic-generator"
version = "0.1.0"
edition = "2021"
description = "Generates synthetic AEGIS scan events using canonical proto types"

[dependencies]
aegis-proto = { path = "../../packet-engine/proto" }
rdkafka = { version = "0.36", features = ["cmake-build"] }
prost = "0.13"
rand = "0.8"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
sha2 = "0.10"
hex = "0.4"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
