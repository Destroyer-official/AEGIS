name: AEGIS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  cargo-build:
    name: Build (Rust)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        workspace:
          - packet-engine
          - enrichment
        include:
          - workspace: packet-engine
            features: ""
          - workspace: enrichment
            features: ""
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libbpf-dev clang llvm
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.workspace }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Build workspace
        run: cargo build --workspace
        working-directory: ${{ matrix.workspace }}
      - name: Run tests
        run: cargo test --workspace
        working-directory: ${{ matrix.workspace }}

  build-standalone:
    name: Build (Standalone Crates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Build check_sip
        run: cargo build
        working-directory: check_sip
      - name: Build gateway
        run: cargo build
        working-directory: gateway
      - name: Build targeting ipv6
        run: cargo build
        working-directory: targeting/ipv6
      - name: Build vistascan
        run: cargo build
        working-directory: targeting/vistascan
      - name: Build synthetic-generator
        run: cargo build
        working-directory: infra/synthetic-generator

  clippy:
    name: Clippy Lint
    runs-on: ubuntu-latest
    needs: [cargo-build]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libbpf-dev clang llvm
      - name: Clippy packet-engine
        run: cargo clippy --workspace -- -D warnings
        working-directory: packet-engine
      - name: Clippy enrichment
        run: cargo clippy --workspace -- -D warnings
        working-directory: enrichment
      - name: Clippy gateway
        run: cargo clippy -- -D warnings
        working-directory: gateway
      - name: Clippy synthetic-generator
        run: cargo clippy -- -D warnings
        working-directory: infra/synthetic-generator

  cargo-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-audit
        run: cargo install cargo-audit
      - name: Audit packet-engine
        run: cargo audit
        working-directory: packet-engine
      - name: Audit enrichment
        run: cargo audit
        working-directory: enrichment
      - name: Audit gateway
        run: cargo audit
        working-directory: gateway
      - name: Audit check_sip
        run: cargo audit
        working-directory: check_sip
      - name: Audit synthetic-generator
        run: cargo audit
        working-directory: infra/synthetic-generator

  cargo-fuzz:
    name: Fuzz Testing
    runs-on: ubuntu-latest
    needs: [cargo-build]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz
      - name: Fuzz JA4 parser
        run: |
          cd packet-engine/ja4
          cargo fuzz run fuzz_ja4 -- -max_total_time=60 || true
        continue-on-error: true
      - name: Fuzz TLS record parser
        run: |
          cd packet-engine/interrogation/tls
          cargo fuzz run fuzz_tls_record -- -max_total_time=60 || true
        continue-on-error: true

  k6-load-test:
    name: k6 Load Test
    runs-on: ubuntu-latest
    needs: [cargo-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D68
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update && sudo apt-get install k6
      - name: Run k6 Trino health check
        run: |
          k6 run infra/scripts/k6-trino-health.js || true
        continue-on-error: true

  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: |
          cargo fmt --check
          cd ../packet-engine && cargo fmt --check
          cd ../enrichment && cargo fmt --check
          cd ../gateway && cargo fmt --check
