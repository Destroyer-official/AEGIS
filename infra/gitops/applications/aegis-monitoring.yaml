apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aegis-monitoring
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: aegis
    aegis.io/component: observability
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/anomalyco/aegis.git
    targetRevision: HEAD
    path: infra/k8s/monitoring
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m