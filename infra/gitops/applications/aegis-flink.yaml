apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aegis-flink
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: aegis
    aegis.io/component: processing
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/anomalyco/aegis.git
    targetRevision: HEAD
    path: infra/charts/aegis-flink
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m