apiVersion: v1
kind: Namespace
metadata:
  name: cost-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cost-controller-config
  namespace: cost-system
data:
  TARGET_NAMESPACES: "default,monitoring"
  REPORT_INTERVAL: "300"
  COST_DATA_DIR: "/var/lib/cost-controller"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cost-controller
  namespace: cost-system
  labels:
    app: cost-controller
    app.kubernetes.io/part-of: aegis
    aegis.io/component: cost-optimization
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cost-controller
  template:
    metadata:
      labels:
        app: cost-controller
    spec:
      serviceAccountName: cost-controller
      containers:
        - name: controller
          image: aegis/cost-controller:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: cost-controller-config
          volumeMounts:
            - name: cost-data
              mountPath: /var/lib/cost-controller
          resources:
            requests:
              memory: "64Mi"
              cpu: "25m"
            limits:
              memory: "128Mi"
              cpu: "100m"
      volumes:
        - name: cost-data
          emptyDir: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cost-controller
  namespace: cost-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cost-controller
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "nodes", "persistentvolumeclaims", "namespaces", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cost-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cost-controller
subjects:
  - kind: ServiceAccount
    name: cost-controller
    namespace: cost-system