apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-network-policy
  annotations:
    policies.kyverno.io/title: Require Network Policy
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Namespace
    policies.kyverno.io/description: >-
      Every namespace containing AEGIS workloads must have a default
      deny-all NetworkPolicy to restrict traffic flow.
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: check-default-deny-networkpolicy
      match:
        any:
          - resources:
              kinds:
                - Namespace
              names:
                - default
                - monitoring
                - litmus
      generate:
        synchronize: true
        apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        name: default-deny-all
        namespace: "{{request.object.metadata.name}}"
        data:
          spec:
            podSelector: {}
            policyTypes:
              - Ingress
              - Egress
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-labels
  annotations:
    policies.kyverno.io/title: Require Labels
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: low
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      All pods must have standard AEGIS labels for monitoring and
      service discovery.
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: require-app-label
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - default
      validate:
        message: "Pods must have 'app' or 'component' label."
        pattern:
          metadata:
            labels:
              app: "?*"
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-image-registries
  annotations:
    policies.kyverno.io/title: Restrict Image Registries
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Containers should only pull images from approved registries
      to prevent supply chain attacks.
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: validate-image-registries
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - default
      validate:
        message: >-
          Image '{{element.image}}' is not from an approved registry.
          Allowed: docker.io, ghcr.io, quay.io, gcr.io, registry.k8s.io
        pattern:
          spec:
            containers:
              - image: "docker.io/* | ghcr.io/* | quay.io/* | gcr.io/* | registry.k8s.io/* | litmuschaos/* | bitnami/* | grafana/* | prom/* | minio/* | trinodb/* | apache/* | projectnessie/* | postgres:*"