apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-resource-limits
  annotations:
    policies.kyverno.io/title: Require Resource Limits
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      All containers must specify CPU and memory requests and limits.
      This prevents resource exhaustion and ensures fair scheduling.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: check-container-resources
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - default
                - monitoring
                - litmus
      validate:
        message: >-
          All containers must have CPU and memory requests and limits defined.
          Found container '{{element.name}}' without resource specification.
        pattern:
          spec:
            containers:
              - name: "*"
                resources:
                  requests:
                    cpu: "?*"
                    memory: "?*"
                  limits:
                    cpu: "?*"
                    memory: "?*"
    - name: check-init-containers
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - default
                - monitoring
                - litmus
      validate:
        message: >-
          All init containers must have CPU and memory requests and limits defined.
        pattern:
          spec:
            initContainers:
              - name: "*"
                resources:
                  requests:
                    cpu: "?*"
                    memory: "?*"
                  limits:
                    cpu: "?*"
                    memory: "?*"