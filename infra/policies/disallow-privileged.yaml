apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-privileged-containers
  annotations:
    policies.kyverno.io/title: Disallow Privileged Containers
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Privileged mode grants root-level access to the host, which is a
      significant security risk. Containers should run as non-privileged.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: deny-privileged
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - default
                - monitoring
                - litmus
      validate:
        message: >-
          Privileged containers are not allowed. Found container '{{element.name}}'
          with securityContext.privileged=true.
        pattern:
          spec:
            containers:
              - securityContext:
                  privileged: "false"
    - name: deny-host-network
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - default
                - monitoring
                - litmus
      validate:
        message: "Host network access is not allowed."
        pattern:
          spec:
            hostNetwork: "false"
    - name: deny-host-pid
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - default
                - monitoring
                - litmus
      validate:
        message: "Host PID namespace is not allowed."
        pattern:
          spec:
            hostPID: "false"
    - name: deny-host-ipc
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - default
                - monitoring
                - litmus
      validate:
        message: "Host IPC namespace is not allowed."
        pattern:
          spec:
            hostIPC: "false"