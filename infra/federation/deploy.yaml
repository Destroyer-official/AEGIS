apiVersion: v1
kind: Namespace
metadata:
  name: federation-system
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: clusterregistries.aegis.io
spec:
  group: aegis.io
  names:
    kind: ClusterRegistry
    listKind: ClusterRegistryList
    plural: clusterregistries
    singular: clusterregistry
    shortNames: [cr, crs]
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required: [clusters]
              properties:
                clusters:
                  type: array
                  items:
                    type: object
                    required: [name, endpoint, region]
                    properties:
                      name:
                        type: string
                      endpoint:
                        type: string
                      region:
                        type: string
                      zone:
                        type: string
                      weight:
                        type: integer
                        minimum: 0
                        maximum: 100
                        default: 50
                      isPrimary:
                        type: boolean
                        default: false
                      kubeconfigSecret:
                        type: string
                      labels:
                        type: object
                        additionalProperties:
                          type: string
                      capabilities:
                        type: array
                        items:
                          type: string
                scanScheduling:
                  type: object
                  properties:
                    strategy:
                      type: string
                      enum: [closest, round-robin, least-loaded, cost-optimized]
                      default: closest
                    targetProximity:
                      type: object
                      properties:
                        enabled:
                          type: boolean
                          default: true
                        maxLatencyMs:
                          type: integer
                          default: 100
                trinoFederation:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: true
                    catalogName:
                      type: string
                      default: aegis-federated
                    syncInterval:
                      type: string
                      default: "300"
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: [Pending, Active, Degraded, Failed]
                readyClusters:
                  type: integer
                lastSyncTime:
                  type: string
                  format: date-time
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
                clusterStatus:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      ready:
                        type: boolean
                      lastHealthCheck:
                        type: string
                        format: date-time
                      latencyMs:
                        type: integer
                      load:
                        type: number
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cluster-registry-controller
  namespace: federation-system
  labels:
    app: cluster-registry-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cluster-registry-controller
  template:
    metadata:
      labels:
        app: cluster-registry-controller
    spec:
      serviceAccountName: federation-controller
      containers:
        - name: controller
          image: aegis/federation-controller:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-u", "cluster-registry-controller.py"]
          resources:
            requests:
              memory: "64Mi"
              cpu: "25m"
            limits:
              memory: "128Mi"
              cpu: "100m"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scan-scheduler
  namespace: federation-system
  labels:
    app: scan-scheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scan-scheduler
  template:
    metadata:
      labels:
        app: scan-scheduler
    spec:
      serviceAccountName: federation-controller
      containers:
        - name: scheduler
          image: aegis/federation-controller:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-u", "scan-scheduler.py"]
          resources:
            requests:
              memory: "64Mi"
              cpu: "25m"
            limits:
              memory: "128Mi"
              cpu: "100m"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trino-federation-sync
  namespace: federation-system
  labels:
    app: trino-federation-sync
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trino-federation-sync
  template:
    metadata:
      labels:
        app: trino-federation-sync
    spec:
      serviceAccountName: federation-controller
      containers:
        - name: syncer
          image: aegis/federation-controller:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-u", "trino-federation.py"]
          resources:
            requests:
              memory: "64Mi"
              cpu: "25m"
            limits:
              memory: "128Mi"
              cpu: "100m"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: federation-controller
  namespace: federation-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: federation-controller
rules:
  - apiGroups: ["aegis.io"]
    resources: ["clusterregistries"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["aegis.io"]
    resources: ["clusterregistries/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["configmaps", "secrets", "pods", "services", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: federation-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: federation-controller
subjects:
  - kind: ServiceAccount
    name: federation-controller
    namespace: federation-system