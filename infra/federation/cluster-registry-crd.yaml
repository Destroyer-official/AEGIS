apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: clusterregistries.aegis.io
  annotations:
    controller-gen.kubebuilder.io/version: v0.13.0
spec:
  group: aegis.io
  names:
    kind: ClusterRegistry
    listKind: ClusterRegistryList
    plural: clusterregistries
    singular: clusterregistry
    shortNames:
      - cr
      - crs
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Status
          type: string
          jsonPath: .status.phase
        - name: Ready
          type: integer
          jsonPath: .status.readyClusters
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - clusters
              properties:
                clusters:
                  type: array
                  items:
                    type: object
                    required:
                      - name
                      - endpoint
                      - region
                    properties:
                      name:
                        type: string
                        description: Unique cluster name
                      endpoint:
                        type: string
                        description: Kubernetes API server endpoint
                      region:
                        type: string
                        description: Geographic region (e.g., us-east-1, eu-west-1)
                      zone:
                        type: string
                        description: Availability zone
                      weight:
                        type: integer
                        minimum: 0
                        maximum: 100
                        default: 50
                        description: Load balancing weight
                      isPrimary:
                        type: boolean
                        default: false
                        description: Whether this is the primary cluster
                      kubeconfigSecret:
                        type: string
                        description: Secret name containing kubeconfig
                      labels:
                        type: object
                        additionalProperties:
                          type: string
                        description: Custom labels for the cluster
                      capabilities:
                        type: array
                        items:
                          type: string
                        description: Cluster capabilities (e.g., gpu, spot, high-memory)
                scanScheduling:
                  type: object
                  properties:
                    strategy:
                      type: string
                      enum:
                        - closest
                        - round-robin
                        - least-loaded
                        - cost-optimized
                      default: closest
                      description: Strategy for scheduling scans across clusters
                    targetProximity:
                      type: object
                      properties:
                        enabled:
                          type: boolean
                          default: true
                        maxLatencyMs:
                          type: integer
                          default: 100
                trinoFederation:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: true
                    catalogName:
                      type: string
                      default: aegis-federated
                    syncInterval:
                      type: string
                      default: "300"
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum:
                    - Pending
                    - Active
                    - Degraded
                    - Failed
                readyClusters:
                  type: integer
                lastSyncTime:
                  type: string
                  format: date-time
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
                clusterStatus:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      ready:
                        type: boolean
                      lastHealthCheck:
                        type: string
                        format: date-time
                      latencyMs:
                        type: integer
                      load:
                        type: number