[package]
name = "aegis-fuzz"
version = "0.1.0"
edition = "2021"
description = "Fuzz targets for AEGIS interrogation protocols"
license = "MIT"
publish = false

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1.3", features = ["derive"] }
aegis-emerging = { path = "../interrogation/emerging" }

# Fuzz targets are compiled via `cargo fuzz` which handles cdylib automatically
# The fuzz_target! macros generate the entry points

[lib]
name = "aegis_fuzz"
path = "lib.rs"