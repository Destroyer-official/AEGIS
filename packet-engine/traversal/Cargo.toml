[package]
name = "aegis-traversal"
version = "0.1.0"
edition = "2021"
description = "Cyclic group permutation for address traversal randomization (§3.2.1)"
license = "MIT"
publish = false

[dependencies]
thiserror = "2"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = { version = "1.0", features = ["bit-set"] }

[[bench]]
name = "traversal_bench"
harness = false
