[package]
name = "aegis-targeting-passive"
version = "0.1.0"
edition = "2024"
description = "Passive intelligence aggregator: CT logs, passive DNS, BGP dump parser"

[dependencies]
thiserror = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
csv = "1"
quick-xml = { version = "0.31", features = ["serialize"] }
flate2 = "1.0"
rayon = "1"
rdkafka = { version = "0.33", features = ["ssl", "sasl"], optional = true }
aegis-proto = { path = "../../proto", optional = true }

[features]
default = []
kafka = ["rdkafka", "aegis-proto"]

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tokio-test = "0.4"

[[bench]]
name = "passive_parse"
harness = false
