[package]
name = "aegis-enrichment-common"
version = "0.1.0"
edition = "2021"
description = "Common enrichment utilities: tiered cache, freshness tracking, audit logging"
license = "MIT"
publish = false

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "fs", "macros", "rt-multi-thread"] }
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
lru = "0.10"

# Optional Redis support (L2 cache)
redis = { version = "0.29", features = ["tokio-comp", "connection-manager"], optional = true }

[features]
default = []
redis = ["dep:redis"]

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
