[package]
name = "aegis-geolocation"
version = "0.1.0"
edition = "2021"
description = "3-tier geolocation engine: cryptographic RPKI geofeeds, RTT triangulation, passive registration fallback (§3.5.1, §8)"
license = "MIT"
publish = false

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
reqwest = { version = "0.12", features = ["rustls-tls"] }
tokio = { version = "1", features = ["full"] }
csv = "1"
chrono = { version = "0.4", features = ["serde"] }
ipnet = "2"
tracing = "0.1"
fastrand = "2"

[dev-dependencies]
tokio-test = "0.4"
criterion = "0.5"

[[bench]]
name = "cbg_benchmark"
harness = false
