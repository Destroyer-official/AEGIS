[package]
name = "aegis-cve"
version = "0.1.0"
edition = "2021"
description = "CVE correlation pipeline: CPE extraction, NVD cache, CVSS v3.1 scoring, streaming (§3.5.2)"
license = "MIT"
publish = false

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
reqwest = { version = "0.12", features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["full", "sync"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
tracing = "0.1"
rdkafka = { version = "0.38", features = ["cmake_build", "tokio"] }
futures = "0.3"

[dev-dependencies]
tokio-test = "0.4"
