[package]
name = "aegis-asset"
version = "0.1.0"
edition = "2021"
description = "Asset relationship graphing: cert serial, SSH key, JARM, BGP AS, DNS edge list, Neo4j export (§3.5.3)"
license = "MIT"
publish = false

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["full", "sync"] }
chrono = { version = "0.4", features = ["serde"] }
ipnet = "2"
tracing = "0.1"
petgraph = "0.6"
neo4rs = { version = "0.8", features = ["json"] }

[dev-dependencies]
tokio-test = "0.4"
